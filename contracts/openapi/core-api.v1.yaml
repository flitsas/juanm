openapi: 3.1.0
info:
  title: GDC Core API
  version: 1.0.0
  description: API principal del backend GDC 2.0 (.NET 10 + EF Core + PostgreSQL)
servers:
  - url: http://localhost:40203
    description: Desarrollo local
paths:
  /auth/login:
    post:
      operationId: authLogin
      summary: Autenticación email/password — emite JWT con tenant y rol
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales inválidas
  /auth/users:
    get:
      operationId: authListTenantUsers
      summary: Lista usuarios del tenant autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios del tenant actual
  /auth/users/{userId}:
    get:
      operationId: authGetTenantUser
      summary: Obtiene usuario por id dentro del tenant actual
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario encontrado
        "404":
          description: No encontrado o fuera de tenant
  /auth/admin/users:
    get:
      operationId: authAdminListAllUsers
      summary: Lista usuarios cross-tenant (SuperAdmin)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista global
        "403":
          description: No autorizado
  /auth/users/invite:
    post:
      operationId: authInviteUser
      summary: Invita usuario a un tenant (SuperAdmin)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Usuario pending creado y correo enviado
        "409":
          description: Email duplicado en tenant
  /auth/users/activate:
    post:
      operationId: authActivateUser
      summary: Activa cuenta con token de invitación (48h)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateUserRequest"
      responses:
        "200":
          description: Cuenta activada
        "410":
          description: Token expirado
  /auth/password/forgot:
    post:
      operationId: authForgotPassword
      summary: Solicita recuperación de contraseña (siempre 202)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Solicitud aceptada
  /auth/password/reset:
    post:
      operationId: authResetPassword
      summary: Restablece contraseña con token de recuperación
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada
        "410":
          description: Token expirado
  /auth/users/{userId}/password:
    put:
      operationId: authAdminSetPassword
      summary: SuperAdmin sobrescribe contraseña de usuario activo
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetPasswordRequest"
      responses:
        "204":
          description: Contraseña actualizada
        "404":
          description: Usuario no encontrado
  /auth/rbac/matrix:
    get:
      operationId: authGetRbacMatrix
      summary: Consulta matriz RBAC roles/permisos (SuperAdmin)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Matriz RBAC
        "403":
          description: No autorizado
    put:
      operationId: authUpdateRbacMatrix
      summary: Actualiza asignaciones de la matriz RBAC (SuperAdmin)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRbacMatrixRequest"
      responses:
        "204":
          description: Matriz actualizada
        "403":
          description: No autorizado
  /auth/logout:
    post:
      operationId: authLogout
      summary: Cierre de sesión — invalida el JWT activo
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: No autenticado o token revocado
  /api/v1/dgc/ocr/lotes:
    post:
      operationId: uploadOcrLote
      summary: Carga individual o masiva de comparendos (PDF/PNG/JPG) con buffer OCR
      tags: [DGC OCR]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Lote OCR creado con ítems en buffer pending
  /api/v1/dgc/ocr/lotes/{loteId}/items:
    get:
      operationId: getOcrLoteItems
      summary: Lista ítems del buffer de validación
      tags: [DGC OCR]
      parameters:
        - name: loteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ítems OCR del lote
  /api/v1/dgc/ocr/items/{itemId}/confirm:
    post:
      operationId: confirmOcrItem
      summary: Confirma guardado desde buffer; rechaza duplicado por número de comparendo
      tags: [DGC OCR]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOcrItemRequest"
      responses:
        "201":
          description: Comparendo persistido
        "409":
          description: Duplicado (DGC_DUPLICATE)
  /api/v1/dgc/comparendos:
    get:
      operationId: listComparendosMaestra
      summary: Maestra DGC con 15 columnas, filtros y paginación
      tags: [DGC Maestra]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          schema:
            type: string
        - name: placa
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: secretaria
          in: query
          schema:
            type: string
        - name: fechaDesde
          in: query
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparendoMaestraListResult"
  /api/v1/dgc/comparendos/{id}:
    get:
      operationId: getComparendoMaestra
      summary: Detalle comparendo con días restantes recalculados
      tags: [DGC Maestra]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle maestra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparendoMaestraItem"
        "404":
          description: No encontrado
  /api/v1/dgc/comparendos/{id}/contraventor:
    put:
      operationId: upsertContraventor
      summary: Asociación manual de contraventor (contingencia RF07)
      tags: [DGC Contraventor]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, documento]
              properties:
                nombre:
                  type: string
                documento:
                  type: string
                correo:
                  type: string
                  format: email
      responses:
        "200":
          description: Contraventor asociado manualmente
        "400":
          description: Datos inválidos
        "404":
          description: Comparendo no encontrado
  /api/v1/dgc/comparendos/{id}/emails:
    get:
      operationId: listEmailLogsByComparendo
      summary: Log de tracking de correos enviados al contraventor
      tags: [DGC Email Log]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Historial de envíos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLogListResult"
        "404":
          description: Comparendo no encontrado
  /api/v1/dgc/emails/{id}/evidence:
    get:
      operationId: getEmailEvidence
      summary: Evidencia HTML del mensaje enviado
      tags: [DGC Email Log]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HTML completo del correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailEvidenceResponse"
        "404":
          description: Evidencia no encontrada
  /api/v1/notif/companies:
    get:
      operationId: listNotifCompanies
      summary: Lista compañías (Super Admin)
      tags: [NOTIF Admin]
      parameters:
        - name: X-Role
          in: header
          required: true
          schema:
            type: string
            enum: [super_admin, SuperAdmin]
      responses:
        "200":
          description: Nómina global de empresas
        "403":
          description: Rol insuficiente
    post:
      operationId: createNotifCompany
      summary: Crea compañía (Super Admin)
      tags: [NOTIF Admin]
      parameters:
        - name: X-Role
          in: header
          required: true
          schema:
            type: string
            enum: [super_admin, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                nit:
                  type: string
                contactPhone:
                  type: string
                contactEmail:
                  type: string
      responses:
        "201":
          description: Compañía creada
        "403":
          description: Rol insuficiente
  /api/v1/notif/companies/{id}:
    get:
      operationId: getNotifCompany
      summary: Obtiene compañía por id (Super Admin)
      tags: [NOTIF Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Role
          in: header
          required: true
          schema:
            type: string
            enum: [super_admin, SuperAdmin]
      responses:
        "200":
          description: Compañía encontrada
        "403":
          description: Rol insuficiente
        "404":
          description: No encontrada
    put:
      operationId: updateNotifCompany
      summary: Actualiza compañía (Super Admin)
      tags: [NOTIF Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Role
          in: header
          required: true
          schema:
            type: string
            enum: [super_admin, SuperAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                nit:
                  type: string
                contactPhone:
                  type: string
                contactEmail:
                  type: string
                isActive:
                  type: boolean
      responses:
        "200":
          description: Compañía actualizada
        "403":
          description: Rol insuficiente
        "404":
          description: No encontrada
    delete:
      operationId: deleteNotifCompany
      summary: Elimina compañía (Super Admin, soft delete)
      tags: [NOTIF Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Role
          in: header
          required: true
          schema:
            type: string
            enum: [super_admin, SuperAdmin]
      responses:
        "204":
          description: Compañía eliminada
        "403":
          description: Rol insuficiente
        "404":
          description: No encontrada
  /api/v1/notif/profile:
    get:
      operationId: getNotifTenantProfile
      summary: Perfil del tenant autenticado
      tags: [NOTIF Admin]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Perfil del tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProfileResponse"
        "404":
          description: Tenant no encontrado
    put:
      operationId: updateNotifTenantProfile
      summary: Actualiza teléfono y correo de contacto del tenant
      tags: [NOTIF Admin]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactPhone:
                  type: string
                contactEmail:
                  type: string
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProfileResponse"
        "404":
          description: Tenant no encontrado
  /api/v1/notif/provider:
    get:
      operationId: getNotifProvider
      summary: Proveedor de email activo del tenant
      tags: [NOTIF Provider]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Configuración activa (sin credenciales en claro)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
        "404":
          description: Sin proveedor configurado
    put:
      operationId: saveNotifProvider
      summary: Guarda proveedor con credenciales cifradas
      tags: [NOTIF Provider]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerType, fromAddress, credentials]
              properties:
                providerType:
                  type: string
                  enum: [api, sendgrid, flit_mail]
                fromAddress:
                  type: string
                credentials:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Proveedor validado y persistido
        "400":
          description: Credenciales inválidas o payload incorrecto
  /api/v1/notif/provider/test:
    post:
      operationId: testNotifProvider
      summary: Envía correo de prueba
      tags: [NOTIF Provider]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destino]
              properties:
                destino:
                  type: string
                  format: email
                providerType:
                  type: string
                fromAddress:
                  type: string
                credentials:
                  type: object
      responses:
        "200":
          description: Prueba exitosa
        "400":
          description: Prueba fallida
  /api/v1/notif/templates:
    get:
      operationId: listNotifTemplates
      summary: Lista plantillas email del tenant
      tags: [NOTIF Templates]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Listado de plantillas
    post:
      operationId: createNotifTemplate
      summary: Crea plantilla email marca blanca
      tags: [NOTIF Templates]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateRequest"
      responses:
        "201":
          description: Plantilla creada
        "400":
          description: Validación fallida
  /api/v1/notif/templates/{id}:
    get:
      operationId: getNotifTemplate
      tags: [NOTIF Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plantilla encontrada
        "404":
          description: No encontrada
    put:
      operationId: updateNotifTemplate
      tags: [NOTIF Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateRequest"
      responses:
        "200":
          description: Plantilla actualizada
        "400":
          description: Validación fallida
    delete:
      operationId: deleteNotifTemplate
      tags: [NOTIF Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Plantilla eliminada
  /api/v1/notif/templates/{id}/preview:
    post:
      operationId: previewNotifTemplate
      summary: Preview HTML con variables de merge
      tags: [NOTIF Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: HTML preview
  /api/v1/notif/templates/assets:
    post:
      operationId: uploadNotifTemplateAsset
      summary: Sube banner o pie PNG/JPG
      tags: [NOTIF Templates]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: URL del asset
        "400":
          description: Formato no permitido
  /api/v1/notif/rules:
    get:
      operationId: listNotifRules
      summary: Lista reglas de comunicación del tenant
      tags: [NOTIF Rules]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reglas configuradas
    post:
      operationId: createNotifRule
      summary: Crea regla cronológica o estatal
      tags: [NOTIF Rules]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotifRuleRequest"
      responses:
        "201":
          description: Regla creada
        "400":
          description: Validación fallida
  /api/v1/notif/rules/{id}:
    get:
      operationId: getNotifRule
      summary: Obtiene regla por id
      tags: [NOTIF Rules]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Regla encontrada
        "404":
          description: No encontrada
    put:
      operationId: updateNotifRule
      summary: Actualiza regla
      tags: [NOTIF Rules]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotifRuleRequest"
      responses:
        "200":
          description: Regla actualizada
        "400":
          description: Validación fallida
        "404":
          description: No encontrada
    delete:
      operationId: deleteNotifRule
      summary: Elimina regla (soft delete)
      tags: [NOTIF Rules]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Eliminada
        "404":
          description: No encontrada
  /api/v1/notif/queue:
    get:
      operationId: listNotifQueue
      summary: Lista cola de envíos del tenant
      tags: [NOTIF Queue]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Items en cola
  /api/v1/notif/switch:
    get:
      operationId: getNotifSwitch
      summary: Estado del switch operativo On/Off
      tags: [NOTIF Switch]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado actual
    put:
      operationId: updateNotifSwitch
      summary: Activa o pausa encolado de nuevos envíos
      tags: [NOTIF Switch]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotifSwitchRequest"
      responses:
        "200":
          description: Switch actualizado
        "400":
          description: Sin proveedor activo
  /api/v1/reglas/runs:
    get:
      operationId: listReglasRuns
      summary: Lista corridas de evaluación REGLAS
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Corridas del tenant
    post:
      operationId: triggerReglasRun
      summary: Dispara evaluación manual de reglas activas
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Corrida aceptada
        "400":
          description: Error en evaluación
  /api/v1/reglas/runs/{id}:
    get:
      operationId: getReglasRun
      summary: Obtiene corrida de evaluación por id
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Corrida encontrada
        "404":
          description: No encontrada
  /api/v1/reglas/matches:
    get:
      operationId: listReglasMatches
      summary: Lista coincidencias regla-comparendo
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: runId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Coincidencias registradas
  /api/v1/reglas/rules:
    get:
      operationId: listReglasRules
      summary: Lista reglas dinámicas DP del tenant
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reglas configuradas
    post:
      operationId: createReglasRule
      summary: Crea regla dinámica con árbol de condiciones
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReglasRuleRequest"
      responses:
        "201":
          description: Regla creada
        "400":
          description: Validación fallida
  /api/v1/reglas/rules/{id}:
    get:
      operationId: getReglasRule
      summary: Obtiene regla dinámica por id
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Regla encontrada
        "404":
          description: No encontrada
    put:
      operationId: updateReglasRule
      summary: Actualiza regla dinámica y condiciones
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReglasRuleRequest"
      responses:
        "200":
          description: Regla actualizada
        "400":
          description: Validación fallida
        "404":
          description: No encontrada
    delete:
      operationId: deleteReglasRule
      summary: Elimina regla dinámica (soft delete)
      tags: [Reglas]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Eliminada
        "404":
          description: No encontrada
  /health:
    get:
      operationId: getHealth
      summary: Health check del servicio y conexión a base de datos
      tags: [System]
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, userId, tenantId, email, role]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
    InviteUserRequest:
      type: object
      required: [email, tenantId]
      properties:
        email:
          type: string
          format: email
        tenantId:
          type: string
          format: uuid
        roleCode:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
    UpdateRbacMatrixRequest:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/RbacAssignmentUpdate"
    RbacAssignmentUpdate:
      type: object
      required: [roleId, permissionId, enabled]
      properties:
        roleId:
          type: string
          format: uuid
        permissionId:
          type: string
          format: uuid
        enabled:
          type: boolean
    AdminSetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    ActivateUserRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
    ConfirmOcrItemRequest:
      type: object
      required: [numeroComparendo, estado, totalValor]
      properties:
        numeroComparendo:
          type: string
        estado:
          type: string
        infractorNombre:
          type: string
        documento:
          type: string
        placa:
          type: string
        infraccionCodigo:
          type: string
        fechaComparendo:
          type: string
          format: date
        totalValor:
          type: number
    ComparendoMaestraItem:
      type: object
      required: [id, estado, numeroComparendo, total, fuente]
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
        numeroComparendo:
          type: string
        infractor:
          type: string
          nullable: true
        documento:
          type: string
          nullable: true
        placa:
          type: string
          nullable: true
        infraccion:
          type: string
          nullable: true
        fechaComparendo:
          type: string
          format: date
          nullable: true
        fechaNotificacion:
          type: string
          format: date
          nullable: true
        diasRestantes:
          type: integer
          nullable: true
        secretaria:
          type: string
          nullable: true
        total:
          type: number
        pago:
          type: string
          nullable: true
        contraventor:
          type: string
          nullable: true
        contraventorNombre:
          type: string
          nullable: true
        contraventorDocumento:
          type: string
          nullable: true
        contraventorCorreo:
          type: string
          format: email
          nullable: true
        dp:
          type: string
          nullable: true
        fuente:
          type: string
          enum: [ocr, manual, import]
    ComparendoMaestraListResult:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComparendoMaestraItem"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer
    EmailLogItem:
      type: object
      required: [id, sentAt, origen, destino, tipoAlerta, estadoEntrega]
      properties:
        id:
          type: string
          format: uuid
        sentAt:
          type: string
          format: date-time
        origen:
          type: string
        destino:
          type: string
        cc:
          type: string
          nullable: true
        tipoAlerta:
          type: string
        estadoEntrega:
          type: string
    EmailLogListResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailLogItem"
    EmailEvidenceResponse:
      type: object
      required: [id, htmlEvidencia]
      properties:
        id:
          type: string
          format: uuid
        htmlEvidencia:
          type: string
    HealthResponse:
      type: object
      required: [status, env, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        env:
          type: string
        database:
          type: string
          enum: [connected, unavailable]
    CompanyResponse:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nit:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    TenantProfileResponse:
      type: object
      required: [tenantId, name]
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        contactPhone:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
    EmailTemplateRequest:
      type: object
      required: [name, subject, htmlBody]
      properties:
        name:
          type: string
        subject:
          type: string
        htmlBody:
          type: string
        bannerUrl:
          type: string
          nullable: true
        footerUrl:
          type: string
          nullable: true
    ProviderResponse:
      type: object
      required: [id, providerType, fromAddress, isActive, dispatchEnabled, hasCredentials]
      properties:
        id:
          type: string
          format: uuid
        providerType:
          type: string
          enum: [api, sendgrid, flit_mail]
        fromAddress:
          type: string
        isActive:
          type: boolean
        dispatchEnabled:
          type: boolean
        hasCredentials:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CreateNotifRuleRequest:
      type: object
      required: [emailTemplateId, name, triggerType]
      properties:
        emailTemplateId:
          type: string
          format: uuid
        name:
          type: string
        triggerType:
          type: string
          enum: [chronological, state]
        triggerDays:
          type: integer
          nullable: true
        triggerReference:
          type: string
          enum: [fecha_comparendo, fecha_notificacion]
          nullable: true
        triggerEstado:
          type: string
          nullable: true
        isActive:
          type: boolean
          default: true
    UpdateNotifRuleRequest:
      allOf:
        - $ref: "#/components/schemas/CreateNotifRuleRequest"
    UpdateNotifSwitchRequest:
      type: object
      required: [dispatchEnabled]
      properties:
        dispatchEnabled:
          type: boolean
    ReglasConditionNode:
      type: object
      required: [nodeType]
      properties:
        nodeType:
          type: string
          enum: [group, predicate]
        logicOperator:
          type: string
          enum: [and, or]
          nullable: true
        fieldKey:
          type: string
          enum: [estado, numero_comparendo, placa, infractor_nombre, fecha_comparendo, fecha_notificacion, destino_email]
          nullable: true
        comparisonOperator:
          type: string
          enum: [eq, neq, gt, lt, contains, not_contains]
          nullable: true
        comparisonValue:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/ReglasConditionNode"
          nullable: true
    ReglasRuleResponse:
      type: object
      required: [id, name, isActive, pdfTemplateId, emailSubject, emailBodyHtml, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        pdfTemplateId:
          type: string
          format: uuid
        emailSubject:
          type: string
        emailBodyHtml:
          type: string
        secretariatContactId:
          type: string
          format: uuid
          nullable: true
        conditionRoot:
          $ref: "#/components/schemas/ReglasConditionNode"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CreateReglasRuleRequest:
      type: object
      required: [name, isActive, pdfTemplateId, emailSubject, emailBodyHtml]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        pdfTemplateId:
          type: string
          format: uuid
        emailSubject:
          type: string
        emailBodyHtml:
          type: string
        secretariatContactId:
          type: string
          format: uuid
          nullable: true
        conditionRoot:
          $ref: "#/components/schemas/ReglasConditionNode"
          nullable: true
    UpdateReglasRuleRequest:
      allOf:
        - $ref: "#/components/schemas/CreateReglasRuleRequest"
    ReglasRunResponse:
      type: object
      required: [id, startedAt, status, triggerType, evaluatedCount, matchedCount, processedCount, failedCount]
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, completed, failed]
        triggerType:
          type: string
          enum: [scheduled, manual]
        evaluatedCount:
          type: integer
        matchedCount:
          type: integer
        processedCount:
          type: integer
        failedCount:
          type: integer
        errorMessage:
          type: string
          nullable: true
    TriggerReglasRunResponse:
      type: object
      required: [runId, matchedCount]
      properties:
        runId:
          type: string
          format: uuid
        matchedCount:
          type: integer
    ReglasMatchResponse:
      type: object
      required: [id, dynamicRuleId, ruleName, comparendoId, comparendoNumero, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        dynamicRuleId:
          type: string
          format: uuid
        ruleName:
          type: string
        comparendoId:
          type: string
          format: uuid
        comparendoNumero:
          type: string
        ruleExecutionRunId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        processedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
