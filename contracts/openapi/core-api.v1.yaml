openapi: 3.1.0
info:
  title: GDC Core API
  version: 1.0.0
  description: API principal del backend GDC 2.0 (.NET 10 + EF Core + PostgreSQL)
servers:
  - url: http://localhost:4002
    description: Desarrollo local
paths:
  /auth/login:
    post:
      operationId: authLogin
      summary: Autenticación email/password — emite JWT con tenant y rol
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales inválidas
  /auth/users:
    get:
      operationId: authListTenantUsers
      summary: Lista usuarios del tenant autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuarios del tenant actual
  /auth/users/{userId}:
    get:
      operationId: authGetTenantUser
      summary: Obtiene usuario por id dentro del tenant actual
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Usuario encontrado
        "404":
          description: No encontrado o fuera de tenant
  /auth/admin/users:
    get:
      operationId: authAdminListAllUsers
      summary: Lista usuarios cross-tenant (SuperAdmin)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista global
        "403":
          description: No autorizado
  /auth/users/invite:
    post:
      operationId: authInviteUser
      summary: Invita usuario a un tenant (SuperAdmin)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Usuario pending creado y correo enviado
        "409":
          description: Email duplicado en tenant
  /auth/users/activate:
    post:
      operationId: authActivateUser
      summary: Activa cuenta con token de invitación (48h)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateUserRequest"
      responses:
        "200":
          description: Cuenta activada
        "410":
          description: Token expirado
  /auth/logout:
    post:
      operationId: authLogout
      summary: Cierre de sesión — invalida el JWT activo
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: No autenticado o token revocado
  /health:
    get:
      operationId: getHealth
      summary: Health check del servicio y conexión a base de datos
      tags: [System]
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, userId, tenantId, email, role]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
    InviteUserRequest:
      type: object
      required: [email, tenantId]
      properties:
        email:
          type: string
          format: email
        tenantId:
          type: string
          format: uuid
        roleCode:
          type: string
    ActivateUserRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
    HealthResponse:
      type: object
      required: [status, env, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        env:
          type: string
        database:
          type: string
          enum: [connected, unavailable]
