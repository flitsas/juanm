# Production docker-compose — VPS deploy (topologia slim: front + gateway + core-api).
#
# Postgres NO esta aqui: corre en el HOST (host.docker.internal:5432).
# El reverse-proxy del HOST termina TLS y enruta los dominios a los puertos
# publicados en 127.0.0.1:
#   juanm.flitsas.online      -> frontend  (127.0.0.1:60106)
#   api.juanm.flitsas.online  -> gateway   (127.0.0.1:60206)  [API publica YARP]
#   core.juanm.flitsas.online -> core-api  (127.0.0.1:60306)  [Gdc.Api interno/debug]
#
# Variables requeridas en .env (junto al compose):
#   CONNECTION_STRING_CORE  cadena Npgsql .NET (Host=...;Port=5432;Database=...;Username=...;Password=...)
#   CORS_ORIGIN             origen permitido del frontend (https://juanm.flitsas.online)
#   VERIFIK_API_TOKEN       token Verifik (RUNT)
# Variables para AISLAR este proyecto del resto del VPS (UNICAS por proyecto):
#   COMPOSE_PROJECT_NAME    nombre del proyecto Compose (default: flit-prod)
#   FRONTEND_PORT / GATEWAY_PORT / CORE_API_PORT   puertos host 127.0.0.1 (defaults: 60106/60206/60306)
#   COMPOSE_SUBNET          subred de la red Compose. DEBE estar dentro de 172.16.0.0/12
#                           (rango ya permitido en ufw hacia Postgres:5432) y ser UNICA
#                           por proyecto en el VPS, o las redes chocan al levantar.
#                           default: 172.30.0.0/16
# Variables opcionales:
#   CORE_API_TAG / FRONTEND_TAG   tag de imagen (default: latest)
#   VERIFIK_BASE_URL / VERIFIK_TIMEOUT_SECONDS
#
# NOTA: login deshabilitado temporalmente -> NO se requieren llaves JWT.
#
# Despliegue:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

# Nombre del proyecto: UNICO por proyecto en el VPS. Si dos repos comparten el
# mismo nombre, `up --remove-orphans` borra los contenedores del otro. Sobrescribir
# con COMPOSE_PROJECT_NAME en el .env de cada proyecto.
name: ${COMPOSE_PROJECT_NAME:-flit-dev}

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ── Gdc.Api (interno, detras de YARP) ─────────────────────────────────────
  core-api:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-juanm-dev}/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/api/Gdc.Api.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Develop}
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Core: ${CONNECTION_STRING_CORE}
      # La app lee Cors:Origins (Program.cs) y separa por ';'. NO usar Cors__AllowedOrigins.
      Cors__Origins: ${CORS_ORIGIN:-https://dev.juanm.flitsas.online}
      # Login deshabilitado temporalmente: DevGenerate evita exigir llaves JWT
      # montadas. Para reactivar login, montar jwt-private/public.pem y quitar esto.
      Jwt__DevGenerate: "true"
      Verifik__BearerToken: ${VERIFIK_API_TOKEN:-}
      Verifik__BaseUrl: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      Verifik__TimeoutSeconds: ${VERIFIK_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${CORE_API_PORT:-40304}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  # ── Gdc.Gateway (API publica YARP: /api, /hubs) ───────────────────────────
  gateway:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-juanm-dev}/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/gateway/Gdc.Gateway.dll"]
    # content root = working_dir, para que YARP cargue sus rutas de appsettings.json
    working_dir: /app/gateway
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Develop}
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://dev.juanm.flitsas.online}
      # Login deshabilitado temporalmente: sin llave JWT el gateway no valida firma
      # ni exige autenticación (ver Gdc.Gateway/Program.cs).
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-40204}:8080"
    depends_on:
      core-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  # ── Frontend (React/Vite + nginx, solo estaticos) ─────────────────────────
  frontend:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-juanm-dev}/frontend:${FRONTEND_TAG:-latest}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-40104}:80"
    depends_on:
      - gateway
    restart: *restart
    logging: *default-logging

# Red Compose con subred FIJA dentro de 172.16.0.0/12 (ya permitido en ufw hacia
# Postgres:5432). Evita que Docker elija 192.168.x al azar y bloquee la conexion
# del contenedor a la DB del host. UNICA por proyecto: ajustar COMPOSE_SUBNET en .env.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/16}
