[project]
name = "flit-python-ml"
version = "1.0.0"
description = "FLIT python-ml — OCR de comparendos (FastAPI + Tesseract)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10.0",
    "pdf2image>=1.17.0",
    "Pillow>=11.0.0",
    "pymupdf>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `File(...)`/`Depends(...)` en defaults es el patron documentado de FastAPI.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/adapters/__init__.py", "app/adapters/ml/__init__.py"]
